<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Preview Studio — LocalWeb UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background: #f2f2f4; color: #111113; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #frameWrap { flex: 1; display: flex; justify-content: center; align-items: stretch; overflow: hidden; }
    #previewFrame { width: 100%; height: 100%; border: 0; background: #fff; transition: width 0.25s ease, border-radius 0.25s ease, margin 0.25s ease; }
    .vp-tablet #previewFrame { width: 820px; border-radius: 16px; margin: 16px 0; box-shadow: 0 24px 60px rgba(0,0,0,0.16); border: 1px solid rgba(0,0,0,0.08); }
    .vp-mobile #previewFrame { width: 390px; border-radius: 26px; margin: 16px 0; box-shadow: 0 24px 60px rgba(0,0,0,0.18); border: 1px solid rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <header class="flex flex-wrap items-center justify-between gap-3 border-b border-zinc-200 bg-white px-4 py-2.5 text-xs">
    <div class="flex items-center gap-2.5">
      <a href="index.html" class="rounded-full border border-zinc-200 bg-zinc-50 px-3.5 py-1.5 font-semibold text-zinc-800 hover:bg-zinc-100 transition">← Gallery (11,520)</a>
      <span id="codeBadge" class="rounded-md bg-zinc-950 px-2.5 py-1 font-mono font-bold text-white">UK-00001</span>
      <span id="metaText" class="hidden text-zinc-500 lg:inline"></span>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="stepLayout(-1)" class="rounded-full border border-zinc-200 px-2.5 py-1.5 text-zinc-600 hover:bg-zinc-100 cursor-pointer" title="Previous">‹</button>
      <button onclick="randomLayout()" class="rounded-full border border-zinc-200 px-3.5 py-1.5 font-semibold text-zinc-800 hover:bg-zinc-100 cursor-pointer">↻ Shuffle</button>
      <button onclick="stepLayout(1)" class="rounded-full border border-zinc-200 px-2.5 py-1.5 text-zinc-600 hover:bg-zinc-100 cursor-pointer" title="Next">›</button>

      <div class="mx-2 hidden h-4 w-px bg-zinc-200 sm:block"></div>
      <div class="hidden rounded-full border border-zinc-200 bg-zinc-50 p-0.5 sm:flex">
        <button onclick="setViewport('desktop')" id="vpDesktop" class="rounded-full bg-zinc-950 px-3 py-1 font-bold text-white">Desktop</button>
        <button onclick="setViewport('tablet')" id="vpTablet" class="rounded-full px-3 py-1 font-semibold text-zinc-500 hover:text-zinc-950">Tablet</button>
        <button onclick="setViewport('mobile')" id="vpMobile" class="rounded-full px-3 py-1 font-semibold text-zinc-500 hover:text-zinc-950">Mobile</button>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleCustomizer()" class="rounded-full border border-zinc-300 bg-white px-3.5 py-1.5 font-bold text-zinc-900 hover:bg-zinc-100 transition cursor-pointer">✎ Personalise Live</button>
      <a href="https://revolut.me/mantosz90/60gbp" target="_blank" rel="noopener" class="rounded-full bg-zinc-950 px-4 py-1.5 font-bold text-white hover:bg-zinc-800 transition">Order This Design — £60/yr →</a>
    </div>
  </header>

  <div id="customizerPanel" class="hidden border-b border-zinc-200 bg-[#fafafa] px-4 py-3 text-xs">
    <div class="mx-auto grid max-w-6xl gap-2.5 sm:grid-cols-2 lg:grid-cols-5">
      <input id="cBiz" type="text" placeholder="Your Business Name..." class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-zinc-950 focus:border-zinc-900 focus:outline-none" />
      <input id="cCity" type="text" placeholder="UK City (e.g. Leeds)" class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-zinc-950 focus:border-zinc-900 focus:outline-none" />
      <input id="cPhone" type="text" placeholder="Phone (e.g. 07700 900123)" class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-zinc-950 focus:border-zinc-900 focus:outline-none" />
      <input id="cDomain" type="text" placeholder="Desired .co.uk domain" class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-zinc-950 focus:border-zinc-900 focus:outline-none" />
      <label class="flex cursor-pointer items-center justify-center rounded-lg border border-dashed border-zinc-300 bg-white px-3 py-2 font-semibold text-zinc-800 hover:bg-zinc-100">
        <span>⬆ Upload Logo (Live)</span>
        <input id="cLogo" type="file" accept="image/*" class="hidden" />
      </label>
    </div>
  </div>

  <main id="frameWrap">
    <iframe id="previewFrame" title="Live Website Preview"></iframe>
  </main>

  <script src="js/engine.js?v=3"></script>
  <script>
    const E = window.UKLayoutEngine;
    const params = new URLSearchParams(window.location.search);
    let currentIdx = E.parseId(params.get("id") || "UK-00001");
    const custom = { business: "", city: "", phone: "", domain: "", logoDataUrl: "" };

    function render() {
      const layout = E.getLayoutByIndex(currentIdx);
      document.title = `${layout.code} — ${layout.bizName} | LocalWeb UK`;
      document.getElementById("codeBadge").textContent = layout.code;
      document.getElementById("metaText").textContent = `${layout.industry.name} · ${layout.arch.name} · ${layout.palette.name} · ${layout.font.name}`;
      const url = new URL(window.location.href);
      url.searchParams.set("id", layout.code);
      window.history.replaceState({}, "", url);
      document.getElementById("previewFrame").srcdoc = E.renderFullPageHTML(layout, custom);
    }

    function stepLayout(delta) { currentIdx = (currentIdx + delta * 251 + E.TOTAL_LAYOUTS) % E.TOTAL_LAYOUTS; render(); }
    function randomLayout() { currentIdx = Math.floor(Math.random() * E.TOTAL_LAYOUTS); render(); }
    function toggleCustomizer() { document.getElementById("customizerPanel").classList.toggle("hidden"); }

    function setViewport(mode) {
      const wrap = document.getElementById("frameWrap");
      wrap.className = mode === "tablet" ? "vp-tablet" : (mode === "mobile" ? "vp-mobile" : "");
      ["Desktop", "Tablet", "Mobile"].forEach(name => {
        const b = document.getElementById("vp" + name);
        b.className = name.toLowerCase() === mode
          ? "rounded-full bg-zinc-950 px-3 py-1 font-bold text-white"
          : "rounded-full px-3 py-1 font-semibold text-zinc-500 hover:text-zinc-950";
      });
    }

    ["cBiz", "cCity", "cPhone", "cDomain"].forEach(id => {
      document.getElementById(id).addEventListener("input", e => {
        custom[{ cBiz: "business", cCity: "city", cPhone: "phone", cDomain: "domain" }[id]] = e.target.value;
        render();
      });
    });

    document.getElementById("cLogo").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { custom.logoDataUrl = reader.result; render(); };
      reader.readAsDataURL(file);
    });

    render();
  </script>
</body>
</html>
